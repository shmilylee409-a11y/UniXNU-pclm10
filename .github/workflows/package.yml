name: package

# Cloud packaging workflow for OPPO Reno Ace (PCLM10 / Project 19081).
# Runs on GitHub Actions macos-26 runner (full Xcode + Homebrew LLVM/LLD/DTC/mtools/ipsw)
# and produces boot.img, payload.img, kernel.macho, and package.manifest.json.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17", "26", "27"]
        default: "17"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-pclm10
      - name: tools
        run: |
          brew install dtc llvm lld cmake ninja unifdef mtools blacktop/tap/ipsw
          ok=1
          for t in clang xcodebuild make git ninja cmake unifdef dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: prepare uefi-pclm10
        run: |
          python3 device/scripts/prepare-pclm10-uefi.py \
            --uefi uefi-pclm10 \
            --device device \
            --tree UniXNU
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID || '19081001' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-pclm10
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-pclm10-${{ inputs.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            UniXNU/out/pclm10/*/*/boot/boot.img
            UniXNU/out/pclm10/*/*/payload/payload.img
            UniXNU/out/pclm10/*/*/kernel/kernel.macho
            UniXNU/out/pclm10/*/*/package.manifest.json
