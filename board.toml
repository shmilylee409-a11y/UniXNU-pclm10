schema_version = 2

[board]
name = "pclm10"
soc = "SM8150"
soc_source = "sm8150"
os_profile = "ipados-17.7.11-21H461"
description = "OPPO Reno Ace (PCLM10 / Project 19081, Snapdragon 855+ SM8150-AC)"
kit = "pclm10"

[components]
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "AppleKeyStoreState",
  "GopFramebuffer",
  "XnuPrelink",
  "DarwinBoot",
]

[kernel]
defconfig = "pclm10_defconfig"
config_fragments = [
  "arch:configs/common.config",
  "soc:configs/sm8150.config",
  "os:configs/ipados.config",
]
patch_series = [
  "arch:patches/xnu/series",
  "device:patches/xnu/series",
  "soc:patches/xnu/series",
  "os:patches/xnu/series",
  "device:patches/xnu/usb-debug.series",
]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "build-pclm10-armcpu.py",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "component:AppleKeyStoreState",
  "build-pclm10-ufs-readonly.py",
  "build-pclm10-usb-debug.py",
]

[device_tree]
source = "device:dts/pclm10.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "pclm10"
dsc = "Platforms/OPPO/pclm10Pkg/pclm10.dsc"
fd = "Build/pclm10Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
patches = [
  "Resources/MuPatches/AsmMacroLib.patch",
  "Resources/MuPatches/Timer.patch",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OPPO",
  "{uefi}/Platforms/Xiaomi",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]
preflight = [
  "scripts/prepare-pclm10-uefi.py",
]

[firmware.defines]
ENABLE_SECUREBOOT = 0
DEVICE_MODEL = 0
SHENG_VENDOR_HW = 0

[bootimg]
# dts/oppo-pclm10-19081.dtb (staged by scripts/prepare-pclm10-uefi.py) already
# contains /reserved-memory/cont_splash_region@9d000000 (36 MiB), so no extra
# [[bootimg.dtb_node]] injection is needed.
dtb = "build/pclm10/pclm10.dtb"

[payload]
volume = "PCLM10"
size_mib = 75
loader = "firmware"
title = "UniXNU (OPPO Reno Ace)"
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "keepsyms=1",
  "-enable_kprintf_spam",
  "security-mode-change-enable=1",
  "amfi_get_out_of_my_way=1",
  "qcom-usb-debug=1",
  "qcom-usb-ctl=1",
  "pclm10-autoreset=45",
  "native-ufs-probe=0",
]

[payload.adt]
chip_id = "8011"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "pclm10_defconfig"

# PM8150 + PM8150B PON / GPIO key mapping (from oppo-pclm10-19081.dtb & DSDT.aml)
# Volume Up   = TLMM GPIO 90 (active low)
# Volume Down = PM8150 PON RESIN_N
# Power       = PM8150 PON KPDPWR_N
[adt.buttons.u32]
vol_up_gpio = 90
vol_down_resin = 1
power_kpdpwr = 1
